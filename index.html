<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนที่ผังเมือง</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/plans.js"></script>
<style>
:root{--ink:#1c2430;--mute:#5d6878;--line:#d9dee6;--bg:#fff;--soft:#f3f5f8;--acc:#0b6bcb;--warn:#8a5300;--warnbg:#fff4dc;--ok:#1b6e3c;--okbg:#e6f5ec}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:"Sarabun","Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;color:var(--ink);font-size:15px}
#map{position:absolute;inset:0;background:#dfe5ec}
.bar{position:absolute;z-index:1200;top:10px;left:10px;right:10px;display:flex;gap:8px;max-width:640px;pointer-events:none}
.bar>*{pointer-events:auto}
.search{flex:1;position:relative}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;background:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.search input:focus{outline:2px solid var(--acc)}
.sug{position:absolute;top:48px;left:0;right:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.2);max-height:55vh;overflow:auto;display:none}
.sug div{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--soft)}
.sug div:hover,.sug div.on{background:var(--soft)}
.sug small{color:var(--mute);display:block}
.btn{height:44px;min-width:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:inherit;padding:0 12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);white-space:nowrap}
.btn:hover{background:var(--soft)}
.ctl{position:absolute;z-index:900;left:10px;bottom:24px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.18);width:230px;font-size:13.5px}
.ctl label{display:flex;align-items:center;gap:6px;margin:4px 0}
.ctl select,.ctl input[type=range]{width:100%;font:inherit}
.ctl .lg{display:flex;align-items:center;gap:6px;color:var(--mute);margin-top:3px}
.ctl .lg i{display:inline-block;width:22px;height:0;border-top:2.5px solid}
.ctl h4{margin:8px 0 2px;font-size:12.5px;color:var(--mute);font-weight:600}
.ctl .tgl{display:none}
.panel{position:absolute;z-index:1100;top:64px;right:10px;bottom:24px;width:400px;max-width:calc(100vw - 20px);background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.22);display:none;flex-direction:column;overflow:hidden}
.panel.open{display:flex}
.panel header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft)}
.panel header b{flex:1;font-size:14px}
.panel header button{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--mute);padding:2px 8px}
.body{overflow:auto;padding:12px 14px 18px;-webkit-overflow-scrolling:touch}
.coord{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:10px}
.coord a,.lnk{color:var(--acc);text-decoration:none;cursor:pointer}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card.main{border-color:#9ec3ea;background:#f6faff}
.cap{font-size:12.5px;color:var(--mute);margin-bottom:2px}
.name{font-size:17px;font-weight:700;line-height:1.35;margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tag{font-size:12.5px;border-radius:99px;padding:2px 9px;background:var(--soft);border:1px solid var(--line)}
.tag.ok{background:var(--okbg);border-color:#b7dfc6;color:var(--ok)}
.tag.old{background:#eee;color:#666}
.w{background:var(--warnbg);border:1px solid #f0d49a;color:var(--warn);border-radius:8px;padding:7px 10px;margin:6px 0;font-size:13.5px;line-height:1.5}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts a,.acts button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink);text-decoration:none}
.acts a:hover,.acts button:hover{background:var(--soft)}
.acts .pri{background:var(--acc);border-color:var(--acc);color:#fff}
.acts .pri:hover{background:#0958a8}
details{margin-top:8px;font-size:13.5px}
details summary{cursor:pointer;color:var(--mute)}
details p{margin:6px 0;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.other{padding:8px 0;border-bottom:1px solid var(--soft);display:flex;gap:8px;align-items:flex-start}
.other:last-child{border:0}
.other div{flex:1}
.other small{color:var(--mute);display:block}
.foot{color:var(--mute);font-size:12.5px;line-height:1.5;margin-top:10px}
h3{font-size:13.5px;margin:14px 0 4px;color:var(--mute)}
.prov summary{padding:7px 0;color:var(--ink);font-weight:600;border-bottom:1px solid var(--soft)}
.prov .it{padding:6px 0 6px 14px;cursor:pointer;border-bottom:1px solid var(--soft)}
.prov .it:hover{background:var(--soft)}
.prov .it small{color:var(--mute)}
.hint{position:absolute;z-index:800;left:50%;transform:translateX(-50%);bottom:28px;background:rgba(28,36,48,.88);color:#fff;border-radius:99px;padding:8px 16px;font-size:13.5px;pointer-events:none;white-space:nowrap}
.zc{border:1px dashed #9ec3ea;border-radius:10px;padding:10px 12px;margin:0 0 10px;background:#fff;font-size:14px;line-height:1.55}
.zc .zv{display:flex;align-items:center;gap:10px;margin:4px 0}
.zc .sw{flex:none;width:30px;height:30px;border-radius:6px;border:1px solid rgba(0,0,0,.25)}
.zc .zn{font-size:16px;font-weight:700}
.zc small{color:var(--mute);display:block}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
.tabs[hidden]{display:none}
.tabs button{flex:1;border:0;border-bottom:3px solid transparent;background:none;font:inherit;font-size:14.5px;padding:9px 0 7px;cursor:pointer;color:var(--mute)}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
.sr{border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.55}
.sr .cap{font-weight:600}
.sr .sw{display:inline-block;width:20px;height:20px;border-radius:5px;vertical-align:-4px;border:1px solid rgba(0,0,0,.25);margin-right:6px}
.sr .zn{font-size:16.5px;font-weight:700}
.sr small{color:var(--mute)}
.sr ul{margin:3px 0 0;padding-left:20px}
.sr .si{margin-top:5px}
.sr .w{margin:5px 0 0;font-size:13px}
.more{width:100%;font:inherit;font-size:14.5px;border:1px solid var(--acc);color:var(--acc);background:var(--bg);border-radius:10px;padding:9px;cursor:pointer;margin-top:2px}
.zr{border:1px solid var(--soft);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:#fff;font-size:14px;line-height:1.55}
.zr details{margin-top:6px}
.zr details.rt{border:1px solid var(--soft);border-radius:8px;padding:6px 10px;background:#fafcfe}
.zr details.rt>summary{color:inherit;font-size:14.5px}
.zr summary small{display:block;color:var(--mute);font-size:12.5px;margin-left:16px}
.zr .rs{font-size:12.5px;color:var(--mute);margin:6px 0;word-break:break-word}
.zr .rs.ok{color:#1a7f37}
.zr .rs.chk{color:var(--warn)}
.zr .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.zr .chip{background:#eef4fb;border-radius:999px;padding:2px 10px;font-size:13px}
.zr .rh{font-weight:700;margin:8px 0 2px}
.zr ol,.zr ul{margin:4px 0;padding-left:22px}
.zr li{margin:3px 0;word-break:break-word}
.zr li small{color:var(--mute)}
.zr p{margin:6px 0;white-space:normal}
#lock{position:fixed;inset:0;z-index:3000;background:#eef2f6;display:flex;align-items:center;justify-content:center;padding:16px}
#lock[hidden],#viewer[hidden]{display:none}
#lock form{background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:24px 22px;width:100%;max-width:360px}
#lock h1{font-size:20px;margin:0 0 4px}
#lock p{margin:0 0 14px;color:var(--mute);font-size:14px}
#lock input[type=password]{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:16px}
#lock label{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:14px}
#lock button{width:100%;height:46px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-size:16px;cursor:pointer}
#lock button:disabled{opacity:.6}
#lockMsg{margin-top:10px;font-size:14px;color:#b00020;min-height:20px}
#viewer{position:fixed;inset:0;z-index:2500;background:#1b1f24;display:flex;flex-direction:column}
#viewer header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#2a3038;color:#fff}
#viewer header b{flex:1;font-size:14px}
#viewer header button{border:0;background:none;color:#fff;font-size:26px;cursor:pointer;padding:0 8px}
#viewer .vb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;text-align:center}
#viewer img{width:100%;height:auto;display:block;background:#fff;cursor:zoom-in}
#viewer img.big{width:auto;max-width:none;cursor:zoom-out}
#viewer .vmsg{color:#cfd6de;padding:24px;font-size:14px}
@media (max-width:760px){
 .panel{top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;max-height:56vh;border-radius:14px 14px 0 0}
 .ctl{bottom:auto;top:62px;width:auto;padding:0;border:0;background:none;box-shadow:none}
 .ctl .tgl{display:block}
 .ctl .in{display:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;width:230px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
 .ctl.open .in{display:block}
 .btn span{display:none}
 .hint{bottom:14px;font-size:12.5px}
}
</style>
</head>
<body>
<div id="map"></div>
<div class="bar">
  <div class="search">
    <input id="q" type="search" autocomplete="off" placeholder="วางพิกัด เช่น 13.7563, 100.5018 หรือพิมพ์ชื่อผัง / จังหวัด">
    <div class="sug" id="sug"></div>
  </div>
  <button class="btn" id="bList" title="รายชื่อผังทั้งหมด">☰<span> รายชื่อผัง</span></button>
  <button class="btn" id="bLoc" title="ตำแหน่งของฉัน">◎</button>
</div>
<div class="ctl" id="ctl">
  <button class="btn tgl" id="bCtl">⚙ ตั้งค่าแผนที่</button>
  <div class="in">
    <select id="base"></select>
    <label><input type="checkbox" id="cImg" checked> ซ้อนภาพผัง</label>
    <label style="display:block">ความทึบภาพผัง <input type="range" id="op" min="0" max="100" value="70"></label>
    <label><input type="checkbox" id="cLine" checked> เส้นขอบเขตผัง</label>
    <div class="lg"><i style="border-color:#d6006c"></i>ผังเมือง / ชุมชน</div>
    <div class="lg"><i style="border-color:#e07b00"></i>แผนผัง EEC</div>
    <div class="lg"><i style="border-color:#1f4fbf;border-top-style:dashed"></i>ผังจังหวัด</div>
    <div class="lg"><i style="border-color:#777;border-top-style:dotted"></i>ฉบับเดิม (ถูกแทนแล้ว)</div>
    <label id="lCoast" hidden><input type="checkbox" id="cCoast"> ชั้นริมทะเล</label>
    <div class="lg" id="lgCoast" hidden><i style="border-color:#c0392b;border-top-width:6px"></i>กฎกระทรวงห้ามก่อสร้าง (แนวระยะจากชายฝั่ง)</div>
    <div class="lg" id="lgEnv" hidden><i style="border-color:#1f6fb4;border-top-width:6px"></i>เขตคุ้มครองสิ่งแวดล้อม (ประกาศ ทส.)</div>
  </div>
</div>
<div class="hint" id="hint">แตะบนแผนที่เพื่อดูว่าจุดนั้นอยู่ผังไหน</div>
<div id="lock" hidden><form id="lockForm" autocomplete="on">
  <h1>แผนที่ผังเมือง</h1><p>ใส่รหัสผ่านเพื่อเปิดแผนที่</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" required>
  <label><input type="checkbox" id="remember" checked> จำบนเครื่องนี้ (ครั้งต่อไปไม่ต้องใส่)</label>
  <button id="pwGo">เปิดแผนที่</button><div id="lockMsg"></div>
</form></div>
<div id="viewer" hidden><header><b id="vTitle"></b><button id="vClose" title="ปิด">×</button></header><div class="vb" id="vBody"></div></div>
<aside class="panel" id="panel">
  <header><b id="pTitle"></b><button id="pClose" title="ปิด">×</button></header>
  <nav class="tabs" id="pTabs" hidden><button data-tab="s" class="on">สรุป</button><button data-tab="d">รายละเอียด</button></nav>
  <div class="body" id="pBody"></div>
</aside>
<script>
(function(){
"use strict";
/* ---------- โหมดล็อก: ข้อมูลและภาพทุกไฟล์เข้ารหัส AES-GCM · กุญแจหลักห่อด้วยรหัสผ่าน (PBKDF2) อยู่ใน window.ZLOCK ---------- */
var LOCK=window.ZLOCK||null,KEY=null,KSTORE="zmap.k",BLANK="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
var b64=function(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
var tob64=function(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);};
function fail(msg){document.body.innerHTML='<p style="padding:24px;font-size:16px;line-height:1.6">'+msg+"</p>";}
function dec(buf){var u=new Uint8Array(buf);return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},KEY,u.slice(12));}
function fetchDec(path){return fetch(path).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.arrayBuffer();}).then(dec);}
function useKey(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]).then(function(k){KEY=k;return fetchDec(LOCK.data);}).then(function(b){return JSON.parse(new TextDecoder().decode(b));});}
function unwrap(pw){
 return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(LOCK.salt),iterations:LOCK.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 }).then(function(kek){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(LOCK.iv)},kek,b64(LOCK.wk));}).then(function(r){return new Uint8Array(r);});}
function forget(){try{localStorage.removeItem(KSTORE);}catch(e){}}
function showLock(){
 var f=document.getElementById("lockForm"),go=document.getElementById("pwGo"),msg=document.getElementById("lockMsg"),pw=document.getElementById("pw");
 document.getElementById("lock").hidden=false;pw.focus();
 f.onsubmit=function(e){e.preventDefault();go.disabled=true;go.textContent="กำลังเปิด...";msg.textContent="";var raw;
  unwrap(pw.value).then(function(r){raw=r;return useKey(r);},function(){throw new Error("pw");}).then(function(data){
   if(document.getElementById("remember").checked){try{localStorage.setItem(KSTORE,tob64(raw));}catch(e){}}
   document.getElementById("lock").hidden=true;pw.value="";start(data);
  }).catch(function(err){go.disabled=false;go.textContent="เปิดแผนที่";
   msg.textContent=err&&err.message==="pw"?"รหัสผ่านไม่ถูกต้อง":"โหลดข้อมูลไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่";pw.select();});};}
function boot(){
 if(!window.L)return fail("เปิดแผนที่ไม่ได้: ต้องต่ออินเทอร์เน็ต");
 if(window.ZDATA)return start(window.ZDATA);
 if(!LOCK)return fail('เปิดแผนที่ไม่ได้: ต้องมีโฟลเดอร์ "ข้อมูล" กับ "ภาพผัง" อยู่ข้างไฟล์นี้');
 if(!(window.crypto&&crypto.subtle))return fail("เปิดแผนที่ไม่ได้: ต้องเปิดผ่านเว็บ (https) เท่านั้น เปิดจากไฟล์ในเครื่องไม่ได้");
 var saved=null;try{saved=localStorage.getItem(KSTORE);}catch(e){}
 if(!saved)return showLock();
 useKey(b64(saved)).then(start,function(){forget();showLock();});}
/* ภาพซ้อน: โหมดในเครื่องใช้ไฟล์ตรง · โหมดล็อกโหลดไฟล์เข้ารหัส ถอดเป็น blob แล้วค่อยวางบนแผนที่ */
var mapRef=null;
function mkOverlay(local,enc,b,opts){
 if(!KEY)return L.imageOverlay(encodeURI(local),b,opts).addTo(mapRef);
 var o=L.imageOverlay(BLANK,b,opts);
 fetchDec("f/"+enc+".bin").then(function(buf){if(o._dead)return;o._blob=URL.createObjectURL(new Blob([buf],{type:"image/webp"}));o.setUrl(o._blob);o.addTo(mapRef);},function(){if(!o._dead)o.fire("error");});
 return o;}
function dropOverlay(o){o._dead=1;if(mapRef.hasLayer(o))mapRef.removeLayer(o);if(o._blob){URL.revokeObjectURL(o._blob);o._blob=null;}}

function start(Z){
var P=Z.plans,A=Z.amend,byId={};P.forEach(function(p){byId[p.id]=p;});A.forEach(function(a){byId[a.id]=a;a.sheet=true;});
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
var MON=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
var thDate=function(iso){var m=/^(\d{4})-(\d\d)-(\d\d)/.exec(iso||"");return m?(+m[3])+" "+MON[m[2]-1]+" "+(+m[1]+543):"";};

/* ---------- แผนที่ฐาน ---------- */
var map=mapRef=L.map("map",{zoomControl:false,preferCanvas:true,maxZoom:20,minZoom:5}).setView([13.3,101.3],6);
L.control.zoom({position:"bottomright"}).addTo(map);
L.control.scale({imperial:false,position:"bottomright"}).addTo(map);
var SITE=!!window.ZSITE,ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/",BASES={};
var esriImg=function(){return L.tileLayer(ESRI+"World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:19,attribution:"ภาพ © Esri, Maxar, Earthstar Geographics"});};
var esriRef=function(n){return L.tileLayer(ESRI+"Reference/"+n+"/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:19});};
if(!SITE){ /* ชุดในเครื่องเท่านั้น: ภาพ Google (ชุดเว็บสาธารณะไม่ใช้ เพราะเงื่อนไขของ Google ไม่ให้ดึงภาพตรง) */
 BASES["ดาวเทียม + ชื่อถนน (Google)"]=L.tileLayer("https://mt{s}.google.com/vt/lyrs=y&hl=th&x={x}&y={y}&z={z}",{subdomains:"0123",maxZoom:20,maxNativeZoom:20,attribution:"ภาพ © Google"});
 BASES["แผนที่ถนน (Google)"]=L.tileLayer("https://mt{s}.google.com/vt/lyrs=m&hl=th&x={x}&y={y}&z={z}",{subdomains:"0123",maxZoom:20,attribution:"© Google"});}
BASES["ดาวเทียม + ถนน (Esri)"]=L.layerGroup([esriImg(),esriRef("World_Transportation"),esriRef("World_Boundaries_and_Places")]);
BASES["ดาวเทียมล้วน (Esri)"]=esriImg();
BASES["แผนที่ถนน ชื่อไทย (OpenStreetMap)"]=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,maxNativeZoom:19,attribution:"© ผู้ร่วมสร้าง OpenStreetMap"});
var baseNow=null,selBase=$("base");

function closeViewer(){$("viewer").hidden=true;$("vBody").innerHTML="";if(vUrl){URL.revokeObjectURL(vUrl);vUrl=null;}}
function openViewer(p){
 closeViewer();$("vTitle").textContent=p.n;$("vBody").innerHTML='<div class="vmsg">กำลังโหลดภาพ...</div>';$("viewer").hidden=false;
 fetchDec("f/"+p.pf+".bin").then(function(buf){
  if($("viewer").hidden)return;vUrl=URL.createObjectURL(new Blob([buf],{type:"image/jpeg"}));
  $("vBody").innerHTML='<img id="vImg" alt="">';var im=$("vImg");im.src=vUrl;im.onclick=function(){im.classList.toggle("big");};
 },function(){$("vBody").innerHTML='<div class="vmsg">โหลดภาพไม่ได้ ลองใหม่อีกครั้ง</div>';});}
$("vClose").onclick=closeViewer;

/* ---------- ค้นหา ---------- */
function parseCoord(s){
 var m=/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/.exec(s)||/@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(s)||/[?&](?:q|ll|query)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/.exec(s)||/(-?\d{1,3}\.\d+)\s*[°]?\s*[NnEe]?\s*[,;\s]\s*(-?\d{1,3}\.\d+)/.exec(s);
 if(!m)return null;var a=+m[1],b=+m[2];if(a>90&&b<=90){var t=a;a=b;b=t;}
 return a>=4&&a<=22&&b>=96&&b<=107?[a,b]:null;}
var q=$("q"),sug=$("sug"),sugList=[];
function suggest(){
 var s=q.value.trim();if(!s||parseCoord(s)){sug.style.display="none";return;}
 var tk=s.toLowerCase().split(/\s+/);
 sugList=P.filter(function(p){var hay=(p.n+" "+p.pv+" "+p.asa).toLowerCase();return tk.every(function(t){return hay.indexOf(t)>=0;});}).sort(function(a,b){return a.rk-b.rk;}).slice(0,25);
 sug.innerHTML=sugList.length?sugList.map(function(p,i){return'<div data-i="'+i+'">'+esc(p.n)+"<small>"+esc(p.pv)+" · "+esc(p.lv)+(p.rk===9?" · ฉบับเดิม":"")+"</small></div>";}).join(""):'<div style="cursor:default;color:#5d6878">ไม่พบผังที่ชื่อตรงกับคำค้น</div>';
 sug.style.display="block";}
q.addEventListener("input",suggest);q.addEventListener("focus",suggest);
q.addEventListener("keydown",function(e){if(e.key!=="Enter")return;var c=parseCoord(q.value);
 if(c){sug.style.display="none";q.blur();inspect(c[0],c[1],true);}else if(sugList.length){sug.style.display="none";q.blur();showPlan(sugList[0]);}});
sug.addEventListener("click",function(e){var d=e.target.closest("[data-i]");if(!d)return;sug.style.display="none";showPlan(sugList[+d.dataset.i]);});
document.addEventListener("click",function(e){if(!e.target.closest(".search"))sug.style.display="none";});

/* ---------- รายชื่อผัง / ตำแหน่งของฉัน / ตั้งค่า ---------- */
$("bList").onclick=function(){
 var g={};P.forEach(function(p){(g[p.pv]=g[p.pv]||[]).push(p);});
 var h='<div class="foot" style="margin:0 0 8px">'+P.length+" ผัง ใน "+Object.keys(g).length+" กลุ่มจังหวัด เลือกผังเพื่อซูมไปดู</div>";
 Object.keys(g).sort(function(a,b){return a.localeCompare(b,"th");}).forEach(function(pv){
  h+='<details class="prov"><summary>'+esc(pv)+" ("+g[pv].length+")</summary>"+g[pv].sort(function(a,b){return a.rk-b.rk||a.n.localeCompare(b.n,"th");}).map(function(p){return'<div class="it" data-plan="'+p.id+'">'+esc(p.n)+(p.rk===9?" <small>(ฉบับเดิม)</small>":"")+"</div>";}).join("")+"</details>";});
 openPanel("รายชื่อผังทั้งหมด",h);};
$("bLoc").onclick=function(){
 if(!navigator.geolocation){alert("เบราว์เซอร์นี้ไม่รองรับการหาตำแหน่ง");return;}
 navigator.geolocation.getCurrentPosition(function(p){inspect(p.coords.latitude,p.coords.longitude,true);},function(){alert("หาตำแหน่งไม่ได้ (เบราว์เซอร์ไม่อนุญาต หรือเปิดจากไฟล์ในเครื่อง) ให้วางพิกัดในช่องค้นหาแทน");},{enableHighAccuracy:true,timeout:15000});};
$("bCtl").onclick=function(){$("ctl").classList.toggle("open");};

/* ---------- เปิดจากลิงก์ที่มีพิกัด ---------- */
var c0=parseCoord(decodeURIComponent(location.search||""));
var hm=/^#(-?\d+\.\d+),(-?\d+\.\d+)(?:,(\d+))?/.exec(location.hash||"");
if(c0){inspect(c0[0],c0[1],true);}
else if(hm){map.setView([+hm[1],+hm[2]],+hm[3]||15);inspect(+hm[1],+hm[2],false);}
if(LOCK){var bl=document.createElement("button");bl.className="btn";bl.style.cssText="margin-top:8px;width:100%;height:36px;font-size:13px";
 bl.textContent="ล็อก (ลืมรหัสบนเครื่องนี้)";bl.onclick=function(){forget();location.reload();};document.querySelector("#ctl .in").appendChild(bl);}
refresh();
}
boot();
})();
